<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Image Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            AI <span>Image Generator</span>
        </div>

        <a href="../index.html" class="home-btn">
            ← Home
        </a>

    </header>


    <main class="container">

        <section class="hero">

            <p class="tag">CREATIVE AI</p>

            <h1>
                Turn your ideas into
                <span>visuals.</span>
            </h1>

            <p class="description">
                Describe an image and let AI transform your imagination
                into a visual concept.
            </p>

        </section>


        <section class="generator">

            <div class="input-section">

                <label for="prompt">
                    Describe your image
                </label>

                <textarea
                    id="prompt"
                    placeholder="Example: A futuristic city at night with flying cars..."
                ></textarea>


                <div class="suggestions">

                    <button onclick="usePrompt('A futuristic city at night with flying cars')">
                        🌃 Futuristic City
                    </button>

                    <button onclick="usePrompt('A peaceful mountain landscape during sunset')">
                        🏔️ Mountain Sunset
                    </button>

                    <button onclick="usePrompt('A cute robot exploring a magical forest')">
                        🤖 Magical Robot
                    </button>

                </div>


                <button class="generate-btn" onclick="generateImage()">
                    ✨ Generate Image
                </button>

            </div>


            <div class="preview-section">

                <div id="placeholder" class="placeholder">

                    <div class="placeholder-icon">
                        ✨
                    </div>

                    <h3>
                        Your image will appear here
                    </h3>

                    <p>
                        Enter a prompt and click Generate Image.
                    </p>

                </div>


                <div id="result" class="result hidden">

                    <div class="generated-image">

                        <div class="image-content">

                            <div class="sun"></div>

                            <div class="mountains"></div>

                            <div class="city">
                                AI
                            </div>

                        </div>

                    </div>

                    <h3 id="resultTitle">
                        Generated Image
                    </h3>

                    <p id="resultPrompt"></p>

                    <button class="download-btn" onclick="downloadImage()">
                        ↓ Download
                    </button>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <p>
            AI Image Generator • AI Interface Collection
        </p>

    </footer>


    <script src="script.js"></script>

</body>
</html>
