<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>🌐 AI Translator</h2>
        <button id="themeBtn">🌙</button>
    </header>

    <main>

        <section class="hero">
            <h1>AI Translator</h1>
            <p>Translate text into different languages quickly and easily.</p>
        </section>

        <section class="translator-container">

            <div class="translator-box">

                <div class="box-header">
                    <h3>Input Text</h3>

                    <select id="fromLanguage">
                        <option value="English">English</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Telugu">Telugu</option>
                        <option value="Tamil">Tamil</option>
                        <option value="French">French</option>
                        <option value="Spanish">Spanish</option>
                    </select>
                </div>

                <textarea id="inputText" placeholder="Enter text here..."></textarea>

            </div>


            <button class="swap-btn" onclick="swapLanguages()">
                ⇄
            </button>


            <div class="translator-box">

                <div class="box-header">
                    <h3>Translation</h3>

                    <select id="toLanguage">
                        <option value="Hindi">Hindi</option>
                        <option value="English">English</option>
                        <option value="Telugu">Telugu</option>
                        <option value="Tamil">Tamil</option>
                        <option value="French">French</option>
                        <option value="Spanish">Spanish</option>
                    </select>
                </div>

                <textarea id="outputText" placeholder="Translation will appear here..." readonly></textarea>

            </div>

        </section>


        <div class="button-area">

            <button onclick="translateText()" class="translate-btn">
                ✨ Translate
            </button>

            <button onclick="clearText()">
                Clear
            </button>

            <button onclick="copyTranslation()">
                📋 Copy
            </button>

        </div>


        <section class="examples">

            <h2>Try Examples</h2>

            <div class="example-buttons">

                <button onclick="setExample('Hello')">
                    Hello
                </button>

                <button onclick="setExample('Good morning')">
                    Good Morning
                </button>

                <button onclick="setExample('Thank you')">
                    Thank You
                </button>

                <button onclick="setExample('How are you?')">
                    How are you?
                </button>

            </div>

        </section>

    </main>


    <footer>
        AI Translator • AI Interface Collection
    </footer>


    <script src="script.js"></script>

</body>

</html>
