<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">⚡ CodeAI</div>

        <div class="header-buttons">
            <button id="clearBtn">New Chat</button>
            <button id="themeBtn">🌙</button>
        </div>
    </header>

    <main>

        <section class="hero">
            <h1>AI Code Assistant</h1>
            <p>Write, explain, debug and improve your code with AI.</p>
        </section>

        <section class="workspace">

            <div class="input-card">

                <h2>💻 Ask your coding question</h2>

                <select id="language">
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="C">C</option>
                    <option value="C++">C++</option>
                </select>

                <textarea id="codeInput"
                    placeholder="Example: Write a Python program to find the largest number in a list..."></textarea>

                <div class="actions">
                    <button onclick="generateCode()">✨ Generate Code</button>
                    <button onclick="explainCode()">📖 Explain</button>
                    <button onclick="debugCode()">🐞 Debug</button>
                </div>

            </div>

            <div class="output-card">

                <div class="output-header">
                    <h2>🤖 AI Response</h2>
                    <button onclick="copyCode()">📋 Copy</button>
                </div>

                <pre id="output">Your AI coding response will appear here...</pre>

            </div>

        </section>

        <section class="suggestions">

            <h2>Try asking</h2>

            <div class="suggestion-grid">

                <button onclick="setQuestion('Write a Python program to find the largest number in a list')">
                    Find largest number in Python
                </button>

                <button onclick="setQuestion('Explain a for loop')">
                    Explain a for loop
                </button>

                <button onclick="setQuestion('Find the error in my code')">
                    Debug my code
                </button>

                <button onclick="setQuestion('Write a function to reverse a string')">
                    Reverse a string
                </button>

            </div>

        </section>

    </main>

    <footer>
        <p>AI Code Assistant • Hackathon UI Project</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
